name: Keep HF Space Alive

on:
  schedule:
    - cron: '0 8 * * *'  # Tous les jours à 8h UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HuggingFace Space
        run: |
          curl -f https://parfait60-mnist-api.hf.space/api/v1/health
          echo "✅ Space pinged successfully"